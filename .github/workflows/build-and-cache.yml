# Build every RF Swift environment and keep the self-hosted attic binary cache
# (nix-cache-infra/) warm so later builds - in CI and on developer machines -
# download instead of compiling.
#
#   1. PULL   use-cache.sh dev wires https://<devHost>/dev in as a substituter,
#             so anything already cached is downloaded, not rebuilt.
#   2. WATCH  `attic watch-store dev` runs next to the build and uploads every
#             store path the moment it is realised. A failing package late in an
#             environment therefore does not throw away the hours of
#             dependencies that did build - they are already in the cache for
#             the next run.
#   3. PUSH   push-to-cache.sh dev uploads the final closure (belt and braces
#             for anything the watcher had not flushed yet).
#
# Repository secrets (see nix-cache-infra/SETUP.md, "Caches + tokens"):
#   ATTIC_TOKEN_DEV   pull+push token for the dev cache (mint-token.sh ci-dev)
#
# Pull requests from forks have no secrets: they build without the cache and
# never push. Pushes on any branch populate dev, so a feature branch's second
# CI run (and your laptop, once pointed at dev) reuse the first run's work.
name: build-and-cache
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-and-cache-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SYSTEM: x86_64-linux
  INFRA_DIR: nix-cache-infra

jobs:
  prepare:
    # Same-repo PRs are already built by their branch push; only run the PR
    # event for forks (which get no token and therefore only read the cache).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      envs: ${{ steps.catalog.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: echo "envs=$(jq -c '[.environments[].name]' catalog.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        env: ${{ fromJSON(needs.prepare.outputs.envs) }}
    env:
      ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN_DEV }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0
            # `attic use` adds the substituter to the runner user's nix.conf;
            # the daemon only honours that for trusted users.
            trusted-users = root runner
      - name: Install attic client
        run: nix profile install nixpkgs#attic-client

      - name: Use dev cache (pull)
        if: env.ATTIC_TOKEN != ''
        run: ./${INFRA_DIR}/scripts/use-cache.sh dev

      - name: Upload store paths while building
        if: env.ATTIC_TOKEN != '' && github.event_name != 'pull_request'
        run: |
          nohup attic watch-store dev > attic-watch.log 2>&1 &
          echo $! > attic-watch.pid
          echo "attic watch-store started (pid $(cat attic-watch.pid))"

      - name: Build ${{ matrix.env }}
        id: build
        run: |
          out=$(nix build ".#packages.${SYSTEM}.${{ matrix.env }}" \
                  --no-link --print-out-paths --print-build-logs --keep-going)
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Push ${{ matrix.env }} closure to dev cache
        if: env.ATTIC_TOKEN != '' && github.event_name != 'pull_request' && steps.build.outcome == 'success'
        run: ./${INFRA_DIR}/scripts/push-to-cache.sh dev "${{ steps.build.outputs.out }}"

      - name: Stop store watcher (flush pending uploads)
        if: always() && env.ATTIC_TOKEN != '' && github.event_name != 'pull_request'
        run: |
          if [ -f attic-watch.pid ]; then
            pid=$(cat attic-watch.pid)
            # Give the watcher a moment to finish uploads queued by the build.
            sleep 30
            kill "$pid" 2>/dev/null || true
            for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          fi
          echo "::group::attic watch-store log"; cat attic-watch.log 2>/dev/null || true; echo "::endgroup::"

      - name: Summary
        if: always()
        env:
          OUT: ${{ steps.build.outputs.out }}
          OUTCOME: ${{ steps.build.outcome }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$ATTIC_TOKEN" ]; then cache="none (no token)"
          elif [ "$EVENT" = pull_request ]; then cache="dev (pull only)"
          else cache="dev (pull + push)"; fi
          {
            echo "## ${{ matrix.env }} (${SYSTEM})"
            echo
            echo "- Build: **$OUTCOME**"
            echo "- Cache: $cache"
            [ -n "$OUT" ] && echo "- Closure: \`$OUT\`"
            true
          } >> "$GITHUB_STEP_SUMMARY"
