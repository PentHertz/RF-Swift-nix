name: CI

# What this does, and why it matters for "does it build all the tools":
#
#  * eval-check   forces every installable environment derivation against the
#                 pinned nixpkgs. Checking the buildEnv (not only its devShell)
#                 catches deep dependency/license failures before users do.
#  * catalog-sync makes sure catalog.json (what the RF Swift binary reads) is in
#                 sync with environments.nix.
# Full closure builds and cache publication run in the independent
# cache-amd64.yml, cache-arm64.yml, and cache-riscv64.yml workflows. Keeping
# those jobs out of this workflow prevents an architecture failure from
# cancelling or obscuring the other architecture reports.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Required checks must also run against the synthetic commit produced by a
  # GitHub merge queue, otherwise the queue waits forever for a missing check.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new commit makes an older PR run obsolete. Main/tag builds are never
# cancelled because they may be publishing paths to the binary cache.
concurrency:
  group: nix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      envs: ${{ steps.list.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Read environment names from catalog.json
        run: |
          envs=$(jq -c '[.environments[].name]' catalog.json)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

  eval-check:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        env: ${{ fromJSON(needs.prepare.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Force installable ${{ matrix.env }} derivation (no build)
        run: |
          nix eval --raw ".#packages.x86_64-linux.${{ matrix.env }}.drvPath"

  catalog-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Regenerate catalog.json and check it is committed
        run: |
          nix eval --json --file ./gen-catalog.nix > catalog.generated.json
          # Compare content ignoring key order / formatting.
          if ! diff <(jq -S . catalog.json) <(jq -S . catalog.generated.json) > /dev/null; then
            echo "::error::catalog.json is out of sync with environments.nix. Run 'nix run .#gen-catalog' and commit."
            diff <(jq -S . catalog.json) <(jq -S . catalog.generated.json) || true
            exit 1
          fi
          echo "catalog.json is in sync."

  required:
    name: Required Nix verification
    if: always()
    needs: [prepare, eval-check, catalog-sync]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every evaluation and catalog check
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          EVAL_RESULT: ${{ needs.eval-check.result }}
          CATALOG_RESULT: ${{ needs.catalog-sync.result }}
        run: |
          for result in "$PREPARE_RESULT" "$EVAL_RESULT" "$CATALOG_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::A required Nix verification job did not succeed."
              exit 1
            fi
          done
          echo "All Nix evaluation and catalog checks passed."
