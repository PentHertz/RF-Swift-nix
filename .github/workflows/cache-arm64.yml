name: Cache arm64
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cache-arm64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      envs: ${{ steps.catalog.outputs.envs }}
    steps:
      - uses: actions/checkout@v4
      - id: catalog
        run: echo "envs=$(jq -c '[.environments[].name]' catalog.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        env: ${{ fromJSON(needs.prepare.outputs.envs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0
      - name: Configure public cache (read only)
        if: github.event_name != 'push'
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE || 'rfswift' }}
      - name: Configure cache publication
        if: github.event_name == 'push'
        uses: cachix/cachix-action@v15
        with:
          name: ${{ vars.CACHIX_CACHE || 'rfswift' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - id: closure
        continue-on-error: true
        run: .github/scripts/build-cache-report.sh aarch64-linux "${{ matrix.env }}" "reports/${{ matrix.env }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nix-cache-arm64-${{ matrix.env }}
          path: reports/${{ matrix.env }}
      - if: steps.closure.outcome != 'success'
        run: exit 1
  report:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nix-cache-arm64-*
          path: reports
      - run: .github/scripts/aggregate-cache-reports.sh reports cache-arm64-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: nix-cache-arm64-report
          path: cache-arm64-report.md
